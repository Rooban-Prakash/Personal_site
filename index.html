    // ADMIN:BRANCHES:START
    var branches = [
  {
    "slug": "blog",
    "title": "Blog",
    "tagline": "Words caught in the silk",
    "blurb": "Longer thinking — essays, notes and half-finished arguments that needed somewhere to sit.",
    "leaves": [
      { "slug": "essays", "title": "Essays", "blurb": "Slow pieces on attention, craft and taste.",
        "body": [
          "Essays are the widest strands of this web. They start as a single question and get pulled outward until the shape holds.",

        ] },

    // Must match the $SECRET value inside save.php on the server.
    var ADMIN_SECRET = 'CHANGE_THIS_TO_A_LONG_RANDOM_STRING';

    var hasUnsavedChanges = false;
    var lastStatusText = "";
    var lastStatusKind = "";

    function slugify(str) {
      return String(str || "")
        .toLowerCase()
        .trim()
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/(^-|-$)/g, "") || "untitled";
    }

    function escapeAttr(str) {
      return String(str == null ? "" : str)
        .replace(/&/g, "&amp;")
        .replace(/"/g, "&quot;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function isHTMLBlock(str) {
      return /^\s*</.test(str || "");
    }

    function setSaveStatus(text, kind) {
      lastStatusText = text;
      lastStatusKind = kind || "";
      var el = document.getElementById("save-status");
      if (!el) return;
      el.textContent = text;
      el.className = "save-status" + (kind ? " save-status-" + kind : "");
    }

    function markUnsaved() {
      hasUnsavedChanges = true;
      setSaveStatus("Unsaved changes", "dirty");
    }

    function buildExportHTML() {
      var html = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
      var marker = /\/\/ ADMIN:BRANCHES:START[\s\S]*?\/\/ ADMIN:BRANCHES:END/;
      var newBlock =
        "// ADMIN:BRANCHES:START\n    var branches = " +
        JSON.stringify(branches, null, 2) +
        ";\n    // ADMIN:BRANCHES:END";
      if (!marker.test(html)) return null;
      return html.replace(marker, newBlock);
    }

    function normalizeSlugs() {
      branches.forEach(function (b) {
        b.slug = slugify(b.slug || b.title);
        b.leaves.forEach(function (l) {
          l.slug = slugify(l.slug || l.title);
        });
      });
    }

    // Saves directly to the server by POSTing the rebuilt HTML to save.php,
    // which overwrites index.html in place. Replaces the old File System
    // Access based flow (which only worked with a local file, never a
    // remote host).
    async function saveChanges() {
      normalizeSlugs();
      var html = buildExportHTML();
      if (html === null) {
        window.alert("Couldn't find the data markers in this page — save aborted.");
        return;
      }

      setSaveStatus("Saving…", "dirty");

      try {
        var res = await fetch('save.php', {
          method: 'POST',
          headers: {
            'Content-Type': 'text/html',
            'X-Admin-Secret': ADMIN_SECRET
          },
          body: html
        });
        var data = await res.json();

        if (!res.ok || !data.ok) {
          throw new Error(data.error || ('HTTP ' + res.status));
        }

        hasUnsavedChanges = false;
        setSaveStatus('Saved to index.html ✓', 'clean');
      } catch (err) {
        console.error(err);
        setSaveStatus('Save failed — see console', 'dirty');
        window.alert('Save failed: ' + err.message);
      }
      renderAdminPage();
    }

    // =========================================================================
    // SPIDER WEB SVG BUILDER
    // =========================================================================

    var SIZE = 720;
    var C = SIZE / 2;
    var R_BRANCH = 168;
    var R_LEAF = 300;
    var leafSpread = 34;

    function getBranchAngles(count) {
      var angles = [];
      if (count <= 0) return angles;
      var step = 360 / count;
      for (var i = 0; i < count; i++) angles.push(-90 + i * step);
      return angles;
    }

    function rad(d) { return (d * Math.PI) / 180; }

    function pt(angle, r) {
      return { x: C + Math.cos(rad(angle)) * r, y: C + Math.sin(rad(angle)) * r };
    }

    function buildSpiderWebSVG() {
      var branchAngles = getBranchAngles(branches.length);
      var nodes = branches.map(function (branch, i) {
        var angle = branchAngles[i];
        var branchPt = pt(angle, R_BRANCH);
        var leafCount = branch.leaves.length;
        var startAngle = angle - ((leafCount - 1) * leafSpread) / 2;

        var leaves = branch.leaves.map(function (leaf, j) {
          var la = startAngle + j * leafSpread;
          return { leaf: leaf, x: pt(la, R_LEAF).x, y: pt(la, R_LEAF).y };
        });

        return { branch: branch, x: branchPt.x, y: branchPt.y, leaves: leaves };
      });

      var rings = [R_BRANCH, R_LEAF];
      function ringPath(r) {
        return "M " + (C - r) + " " + C + " A " + r + " " + r + " 0 1 1 " + (C + r) + " " + C + " A " + r + " " + r + " 0 1 1 " + (C - r) + " " + C;
      }

      var ringsHTML = rings
        .map(function (r) {
          return '<path d="' + ringPath(r) + '" fill="none" stroke="var(--silk)" stroke-width="0.8" stroke-opacity="0.5" />';
        })
        .join("");

      var branchGroupsHTML = nodes
        .map(function (n, i) {
          var animDelay = i * -2.3;
          var animDuration = 7 + i * 1.6;

          var strandLines = '<line x1="' + C + '" y1="' + C + '" x2="' + n.x + '" y2="' + n.y + '" stroke="var(--silk-strong)" stroke-width="1.4" />';

          var leafLines = n.leaves
            .map(function (l) {
              return '<line x1="' + n.x + '" y1="' + n.y + '" x2="' + l.x + '" y2="' + l.y + '" stroke="var(--silk-strong)" stroke-width="1" stroke-opacity="0.8" />';
            })
            .join("");

          var leafNodesHTML = n.leaves
            .map(function (l, j) {
              var lAnimDelay = j * -1.7 - i;
              var lAnimDuration = 6 + j;
              var labelY = l.y + (l.y < C ? -16 : 24);

              return (
                '<a onclick="event.stopPropagation(); navigate(\'/' + n.branch.slug + "/" + l.leaf.slug + '\')" class="group" style="cursor:pointer">' +
                '<g class="strand-wobble" style="animation-delay:' + lAnimDelay + "s; animation-duration:" + lAnimDuration + 's">' +
                '<circle cx="' + l.x + '" cy="' + l.y + '" r="22" fill="transparent" />' +
                '<circle cx="' + l.x + '" cy="' + l.y + '" r="5" fill="var(--dew)" class="leaf-dot" data-hover-color="var(--accent-warm)" filter="url(#softGlow)" />' +
                '<text x="' + l.x + '" y="' + labelY + '" text-anchor="middle" fill="var(--muted-foreground)" font-family="var(--font-body)" font-size="13px" letter-spacing="0.025em" class="leaf-label" data-hover-color="var(--accent-warm)">' + escapeHTML(l.leaf.title) + "</text>" +
                "</g>" +
                "</a>"
              );
            })
            .join("");

          var branchNodeHTML =
            '<a onclick="event.stopPropagation(); navigate(\'/' + n.branch.slug + '\')" class="group" style="cursor:pointer">' +
            '<circle cx="' + n.x + '" cy="' + n.y + '" r="15" fill="var(--accent-warm)" opacity="0.5" filter="url(#strongGlow)" class="node-glow" style="animation-delay:' + (i * -1.3) + 's" />' +
            '<circle cx="' + n.x + '" cy="' + n.y + '" r="9" fill="var(--accent-warm)" class="branch-dot" data-hover-color="var(--dew)" filter="url(#softGlow)" />' +
            '<circle cx="' + n.x + '" cy="' + n.y + '" r="17" fill="none" stroke="var(--accent-warm)" stroke-width="1" opacity="0.4" class="branch-ring" data-hover-opacity="1" />' +
            '<text x="' + n.x + '" y="' + (n.y - 28) + '" text-anchor="middle" fill="var(--foreground)" font-family="var(--font-display)" font-size="19px" letter-spacing="0.18em" text-transform="uppercase">' + escapeHTML(n.branch.title) + "</text>" +
            "</a>";

          return (
            '<g class="strand-wobble" style="animation-delay:' + animDelay + "s; animation-duration:" + animDuration + 's">' +
            strandLines + leafLines + leafNodesHTML + branchNodeHTML +
            "</g>"
          );
        })
        .join("");

      var centerHTML =
        '<circle cx="' + C + '" cy="' + C + '" r="60" fill="var(--accent-warm)" opacity="0.28" filter="url(#strongGlow)" class="node-glow" style="animation-duration:5s" />' +
        '<circle cx="' + C + '" cy="' + C + '" r="44" fill="var(--card)" stroke="var(--silk-strong)" filter="url(#softGlow)" />' +
        '<text x="' + C + '" y="' + (C + 6) + '" text-anchor="middle" fill="var(--foreground)" font-family="var(--font-display)" font-size="22px" letter-spacing="0.1em">' + escapeHTML(CENTER.name) + "</text>";

      var defsHTML =
        '<defs>' +
        '<filter id="softGlow" x="-200%" y="-200%" width="500%" height="500%">' +
        '<feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur1" />' +
        '<feGaussianBlur in="SourceGraphic" stdDeviation="14" result="blur2" />' +
        '<feMerge><feMergeNode in="blur2" /><feMergeNode in="blur1" /><feMergeNode in="SourceGraphic" /></feMerge>' +
        '</filter>' +
        '<filter id="strongGlow" x="-300%" y="-300%" width="700%" height="700%">' +
        '<feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur1" />' +
        '<feGaussianBlur in="SourceGraphic" stdDeviation="22" result="blur2" />' +
        '<feMerge><feMergeNode in="blur2" /><feMergeNode in="blur1" /><feMergeNode in="SourceGraphic" /></feMerge>' +
        '</filter>' +
        '<radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">' +
        '<stop offset="0%" stop-color="var(--accent-warm)" stop-opacity="0.45" />' +
        '<stop offset="60%" stop-color="var(--accent-warm)" stop-opacity="0.12" />' +
        '<stop offset="100%" stop-color="var(--accent-warm)" stop-opacity="0" />' +
        '</radialGradient>' +
        '</defs>';

      var ambientGlowHTML = '<circle cx="' + C + '" cy="' + C + '" r="' + (R_LEAF * 0.95) + '" fill="url(#centerGlow)" class="node-glow" style="animation-duration:8s" />';

      return (
        '<div class="spider-web-container">' +
        '<svg viewBox="0 0 ' + SIZE + " " + SIZE + '" xmlns="http://www.w3.org/2000/svg">' +
        defsHTML +
        '<g class="web-sway">' +
        '<g class="web-group" id="web-drag-group">' +
        ambientGlowHTML + ringsHTML + branchGroupsHTML + centerHTML +
        "</g>" +
        "</g>" +
        "</svg>" +
        "</div>"
      );
    }

    function initSpiderWeb() {
      var svg = document.querySelector(".spider-web-container svg");
      var g = document.getElementById("web-drag-group");
      if (!svg || !g) return;
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

      var x = 0, y = 0, vx = 0, vy = 0;
      var dragging = false;
      var startX = 0, startY = 0;
      var moved = false;
      var raf = 0;

      function getScale() { return SIZE / (svg.getBoundingClientRect().width || SIZE); }

      function apply() {
        g.style.transform = "translate(" + x + "px, " + y + "px) rotate(" + (x * 0.012) + "deg)";
      }

      function tick() {
        if (!dragging) {
          vx += -x * 0.06;
          vy += -y * 0.06;
          vx *= 0.9;
          vy *= 0.9;
          x += vx;
          y += vy;
          if (Math.abs(x) < 0.05 && Math.abs(y) < 0.05 && Math.abs(vx) < 0.05 && Math.abs(vy) < 0.05) {
            x = y = vx = vy = 0;
            apply();
            raf = 0;
            return;
          }
          apply();
        }
        raf = requestAnimationFrame(tick);
      }

      function loop() { if (!raf) raf = requestAnimationFrame(tick); }

      function onDown(e) {
        dragging = true;
        moved = false;
        startX = e.clientX;
        startY = e.clientY;
        vx = vy = 0;
        loop();
      }

      function onMove(e) {
        if (!dragging) return;
        var s = getScale();
        var nx = (e.clientX - startX) * s * 0.45;
        var ny = (e.clientY - startY) * s * 0.45;
        if (Math.abs(e.clientX - startX) > 6 || Math.abs(e.clientY - startY) > 6) moved = true;
        var prevX = x, prevY = y;
        var limit = 90;
        x = Math.max(-limit, Math.min(limit, nx));
        y = Math.max(-limit, Math.min(limit, ny));
        vx = x - prevX;
        vy = y - prevY;
        apply();
        if (moved) e.preventDefault();
      }

      function onUp() {
        if (!dragging) return;
        dragging = false;
        loop();
      }

      function onClick(e) {
        if (moved) {
          e.preventDefault();
          e.stopPropagation();
          moved = false;
        }
      }

      svg.addEventListener("pointerdown", onDown);
      window.addEventListener("pointermove", onMove, { passive: false });
      window.addEventListener("pointerup", onUp);
      window.addEventListener("pointercancel", onUp);
      svg.addEventListener("click", onClick, true);

      svg._spiderWebCleanup = function () {
        svg.removeEventListener("pointerdown", onDown);
        window.removeEventListener("pointermove", onMove);
        window.removeEventListener("pointerup", onUp);
        window.removeEventListener("pointercancel", onUp);
        svg.removeEventListener("click", onClick, true);
        if (raf) cancelAnimationFrame(raf);
      };
    }

    function cleanupSpiderWeb() {
      var svg = document.querySelector(".spider-web-container svg");
      if (svg && svg._spiderWebCleanup) svg._spiderWebCleanup();
    }

    // =========================================================================
    // META TAG HELPERS
    // =========================================================================

    function updateMetaDescription(desc) {
      var meta = document.querySelector('meta[name="description"]');
      if (meta) meta.setAttribute("content", desc);
    }

    function updateOGTitle(title) {
      var meta = document.querySelector('meta[property="og:title"]');
      if (meta) meta.setAttribute("content", title);
    }

    function updateOGDescription(desc) {
      var meta = document.querySelector('meta[property="og:description"]');
      if (meta) meta.setAttribute("content", desc);
    }

    // =========================================================================
    // UTILITY
    // =========================================================================

    function escapeHTML(str) {
      var div = document.createElement("div");
      div.appendChild(document.createTextNode(str));
      return div.innerHTML;
    }

    // =========================================================================
    // ROUTER DISPATCH
    // =========================================================================

    function route() {
      cleanupSpiderWeb();
      var parsed = parseHash();
      var parts = parsed.parts;

      try {
        if (parts.length === 0) {
          renderHomePage();
        } else if (parts.length === 1 && parts[0] === "admin") {
          renderAdminPage();
        } else if (parts.length === 1) {
          renderBranchPage(parts[0]);
        } else if (parts.length === 2) {
          renderLeafPage(parts[0], parts[1]);
        } else {
          renderNotFoundPage();
        }
      } catch (e) {
        console.error(e);
        renderErrorPage();
      }
    }

    window.addEventListener("hashchange", route);
    route();

    if (!window.location.hash) window.location.hash = "#/";
  </script>
</body></html>
